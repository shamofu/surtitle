[workspace]
members = ["crates/core", "crates/tools", "crates/ai", "crates/ai-validation", "src-tauri"]
default-members = ["crates/core", "crates/tools", "crates/ai"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.98"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
