<!doctype html><html lang="en"><meta charset="utf-8"><title>GPU composition fixture</title>
<style>
html,body{background:transparent;margin:0;color:white;font:20px system-ui}aside{position:absolute;left:70px;top:90px;width:510px;padding:28px;background:#101b3399;border:2px solid #ffffffa0;border-radius:24px;box-shadow:0 20px 45px #0007}button,input{font:18px system-ui;padding:12px;margin:6px;background:#ffffffd0;color:#152033;border:0;border-radius:8px}label{display:block}#badge{position:absolute;right:50px;top:35px;background:#ad254699;padding:20px;border-radius:20px;animation:float 3s ease-in-out infinite alternate}@keyframes float{to{transform:translateY(75px);opacity:.5}}p{font-size:16px}output{display:block;min-height:26px}#meaning-panel[hidden]{display:none}
</style>
<aside><h2>GPU composition fixture</h2>
<p>Generated local media and isolated native phrase file. This exercises the rendering host; it is not Surtitle's production service layer.</p>
<button id="play">Play</button><button id="pause">Pause</button>
<button id="select">Select subtitle at 2 seconds</button><button id="meaning">Explore meaning</button>
<section id="meaning-panel" hidden><p>Selected fixture phrase: Keep learning.</p><label>Meaning <input aria-label="Japanese input" id="translation"></label><button id="save">Save phrase</button><button id="resume">Resume video</button></section>
<output id="status">Ready</output></aside><div id="badge">Animated translucent UI</div>
<script>
const send=(action,extra={})=>chrome.webview.postMessage({action,...extra});
for(const action of ['play','pause','select','meaning','resume'])document.getElementById(action).onclick=()=>send(action);
document.getElementById('save').onclick=()=>send('save',{term:'Keep learning.',meaning:document.getElementById('translation').value});
document.getElementById('translation').addEventListener('compositionend',e=>chrome.webview.postMessage({composition:e.data}));
window.receipts=[];
chrome.webview.addEventListener('message',event=>{const result=event.data;receipts.push(result);document.getElementById('status').textContent=result.action+' acknowledged; paused='+result.paused+'; saved='+result.saved;if(result.action==='meaning')document.getElementById('meaning-panel').hidden=false;if(result.action==='resume')document.getElementById('meaning-panel').hidden=true;});
chrome.webview.postMessage({ready:true,ratio:devicePixelRatio});
</script></html>
