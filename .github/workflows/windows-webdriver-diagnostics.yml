name: Windows WebDriver token diagnostics
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  token:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check the Windows runner token without launching the application
        shell: pwsh
        run: |
          $arguments = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('["-NoLogo","-NoProfile","-NonInteractive","-Command","exit 0"]'))
          & scripts/run-windows-standard-user.ps1 -Application (Get-Command pwsh -CommandType Application).Source -ArgumentsBase64 $arguments
