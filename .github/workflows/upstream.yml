name: Upstream CLI contract
on:
  workflow_dispatch:
  schedule:
    - cron: '24 3 * * 1'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Latest upstream CLI contract (no Vertex)
        run: cargo test -p surtitle-tools --test live -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-cli-evidence
          path: artifacts/upstream/
