name: Test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      require_native_acceptance:
        description: 'Require the comprehensive native report, including manual measurements'
        required: false
        type: boolean
        default: false
      native_candidate_run_id:
        description: 'Optional run containing package-candidate-<SHA>; reuse the exact manually measured installer'
        required: false
        type: string
      native_evidence_run_id:
        description: 'Optional run containing gpui-native-external-<SHA> measurements for this exact binary/installer/revision'
        required: false
        type: string
permissions:
  contents: read
env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/work/target
  SURTITLE_RESOURCE_DIR: ${{ github.workspace }}/work/resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/check-release.mjs
  native-build:
    needs: [validate]
    uses: ./.github/workflows/native-build.yml
  linux:
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
      LIBGL_ALWAYS_SOFTWARE: 1
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        id: node
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Read the native Rust toolchain pin
        id: rust
        shell: bash
        run: echo "version=$(node -p 'require("./native/installer-inputs.json").rust.version')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2.87.28
        with:
          tool: cargo-nextest@0.9.148
      - name: Install the package manager declared by this checkout
        id: pnpm
        run: |
          npm install -g "$(node -p 'require("./package.json").packageManager')"
          echo "version=$(pnpm --version)" >> "$GITHUB_OUTPUT"
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-pnpm-${{ steps.pnpm.outputs.version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'Cargo.lock') }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ubuntu-24.04-debug
          workspaces: . -> work/target
      - name: Install Linux desktop and test dependencies
        id: native-dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake perl pkg-config clang libfontconfig1-dev libfreetype6-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev mesa-vulkan-drivers libssl-dev xvfb dbus-x11 ffmpeg libmpv-dev fonts-noto-cjk
      - run: pnpm install --frozen-lockfile
        id: dependencies
      - run: pnpm setup:rust-tools
        id: rust-tools
      - name: Read the formal verification Java pin
        id: formal-toolchain
        run: echo "java=$(node -p 'require("./verification/toolchain.json").javaMajor')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: ${{ steps.formal-toolchain.outputs.java }}
      - uses: actions/cache@v6.1.0
        with:
          path: work/tools/tla/
          key: tlc-${{ hashFiles('verification/toolchain.json') }}
      - name: Acquire and verify the pinned model checker
        run: pnpm setup:formal
      - name: Exhaustive AI models and negative controls
        run: pnpm test:formal
      - name: Production feature contract
        id: contracts
        run: node scripts/check-production-features.mjs
      - name: Build and process helper tests
        id: javascript-tests
        run: pnpm test
        env:
          SURTITLE_TEST_REPORT: work/test-results/vitest/linux.xml
      - name: Build the native GPUI desktop
        id: frontend-build
        run: pnpm build
      - name: Rust formatting
        id: rust-format
        run: pnpm fmt:rust:check
      - name: Rust workspace tests
        id: rust-tests
        run: pnpm test:rust
      - name: Rust tests without default features
        id: rust-no-default
        run: pnpm test:rust:no-default-features
      - name: Rust documentation tests
        id: rust-doc
        run: pnpm test:rust:doc
      - name: Rust lint
        id: rust-lint
        run: pnpm lint:rust
      - name: Dependency audits
        id: dependency-audits
        run: |
          pnpm audit:rust
          node scripts/audit-js-licenses.mjs
      - name: Required FFmpeg integration tests
        id: rust-native
        run: SURTITLE_TEST_FFMPEG="$(command -v ffmpeg)" pnpm test:rust:required linux-ffmpeg
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: linux-evidence-${{ github.sha }}
          path: |
            work/artifacts/
            work/test-results/
  windows:
    needs: [native-build]
    runs-on: windows-2025
    # Fake GPUI/UI logic and real backend media tests run here. Installed native
    # geometry/rendering/IME/audio/performance collection is an explicit package opt-in.
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh -NoProfile -Command "$ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; & '{0}'"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        id: node
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Prepare hosted Windows desktop capacity
        id: desktop-setup
        run: node e2e/support/prepare-ci-desktop.mjs
      - name: Prepare and verify native input desktop
        id: input-setup
        run: |
          node e2e/support/prepare-native-input.mjs
          & e2e/support/ci-desktop.ps1 -Action prepare-input
          Copy-Item -LiteralPath work/test-results/windows-input-console.json -Destination work/test-results/windows-input-console-pre-build.json
          node e2e/support/native-input-smoke.mjs
      - name: Read the native Rust toolchain pin
        id: rust
        shell: bash
        run: echo "version=$(node -p 'require("./native/installer-inputs.json").rust.version')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2.87.28
        with:
          tool: cargo-nextest@0.9.148
      - name: Install the package manager declared by this checkout
        id: pnpm
        run: |
          $packageManager = (Get-Content package.json -Raw | ConvertFrom-Json).packageManager
          npm install -g $packageManager
          "version=$(pnpm --version)" >> $env:GITHUB_OUTPUT
          "store=$(pnpm store path --silent)" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-pnpm-${{ steps.pnpm.outputs.version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'Cargo.lock') }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: native-build-${{ github.sha }}
          path: work/native-ci-artifact/
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: windows-2025-debug
          workspaces: . -> work/target
      - run: pnpm install --frozen-lockfile
        id: dependencies
      - run: node scripts/check-production-features.mjs
        id: production-contract
      - name: Windows process, profile and distribution script tests
        id: script-tests
        run: pnpm test:scripts --exclude e2e/support/foreground-activation.test.mjs
        env:
          SURTITLE_TEST_REPORT: work/test-results/vitest/windows-scripts.xml
      - name: Verify native activation when foreground requests are denied
        id: foreground-tests
        run: pnpm test:scripts e2e/support/foreground-activation.test.mjs
        env:
          SURTITLE_E2E_NATIVE_INPUT: '1'
          SURTITLE_TEST_REPORT: work/test-results/vitest/windows-foreground.xml
      - run: pnpm build
        id: frontend-build
      - name: Rust workspace tests
        id: rust-tests
        run: pnpm test:rust
      - name: Windows GPUI backend regressions
        run: cargo test -p gpui-pre-windows --lib --locked
      - name: Verify ordinary builds cannot bypass evaluation accounting
        id: rust-no-default
        run: pnpm test:rust:no-default-features
      - name: Rust documentation tests
        id: rust-doc
        run: pnpm test:rust:doc
      - run: pnpm lint:rust
        id: rust-lint
      - name: Prepare native runtime and test initialization
        id: native-runtime
        run: |
          pwsh native/windows/native-prepare.ps1 -WithDevModel
          pwsh native/windows/native-smoke.ps1
      - name: Cache the pinned test FFmpeg archive
        uses: actions/cache@v6.1.0
        with:
          path: work/ci-ffmpeg/*.zip
          key: test-ffmpeg-${{ runner.os }}-${{ hashFiles('e2e/support/prepare-ffmpeg.ps1') }}
      - name: Prepare generated media
        id: native-tools-fixtures
        run: |
          & e2e/support/prepare-ffmpeg.ps1
          pnpm test:fixtures
          & $env:FFMPEG_PATH -v error -f lavfi -i 'testsrc2=size=320x180:rate=12:duration=3' -c:v libaom-av1 -cpu-used 8 -crf 50 -y work/e2e-av1.mkv
          pnpm build:fixtures
      - name: Build the native GPUI fixture-enabled binary
        id: native-build
        run: pnpm build:native:e2e
      - name: Required FFmpeg, libmpv and Silero regressions
        id: rust-native
        run: |
          python e2e/support/acquire-spoken-fixtures.py
          pnpm test:rust:required windows-native
        env:
          SURTITLE_SPOKEN_FIXTURES: ${{ github.workspace }}\work\spoken-fixtures
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: windows-evidence-${{ github.sha }}
          path: |
            work/artifacts/
            work/test-results/
            work/spoken-fixtures/acquisition.json
  package:
    needs: [native-build]
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      NATIVE_CANDIDATE_RUN_ID: ${{ inputs.native_candidate_run_id || vars.SURTITLE_NATIVE_CANDIDATE_RUN_ID || '' }}
      NATIVE_EVIDENCE_RUN_ID: ${{ inputs.native_evidence_run_id || vars.SURTITLE_NATIVE_EVIDENCE_RUN_ID || '' }}
      REQUIRE_NATIVE_ACCEPTANCE: ${{ inputs.require_native_acceptance || vars.SURTITLE_REQUIRE_NATIVE_ACCEPTANCE || 'false' }}
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh -NoProfile -Command "$ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; & '{0}'"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify the system VC runtime before building the installer
        id: vc-runtime
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File native/vc-prerequisite.ps1 -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw 'The package runner failed the VC runtime prerequisite check.' }
      - uses: actions/setup-node@v7.0.0
        id: node
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Prepare hosted Windows desktop capacity
        id: desktop-setup
        run: node e2e/support/prepare-ci-desktop.mjs
      - name: Read the native Rust toolchain pin
        id: rust
        shell: bash
        run: echo "version=$(node -p 'require("./native/installer-inputs.json").rust.version')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - name: Install the package manager declared by this checkout
        id: pnpm
        run: |
          $packageManager = (Get-Content package.json -Raw | ConvertFrom-Json).packageManager
          npm install -g $packageManager
          "version=$(pnpm --version)" >> $env:GITHUB_OUTPUT
          "store=$(pnpm store path --silent)" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-pnpm-${{ steps.pnpm.outputs.version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'Cargo.lock') }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: native-build-${{ github.sha }}
          path: work/native-ci-artifact/
          run-id: ${{ env.NATIVE_CANDIDATE_RUN_ID || github.run_id }}
          github-token: ${{ github.token }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: windows-2025-release-v2
          workspaces: . -> work/target
          cache-targets: false
          cache-directories: |
            work/target/debug
            work/target/release
      - run: pnpm install --frozen-lockfile
        id: dependencies
      - run: pwsh native/windows/native-prepare.ps1
        id: native-runtime
      - name: Prepare NSIS installer sources and runtime notices
        id: installer-inputs
        run: python native/windows/native-installer-prepare.py
      - name: Generate distribution notices and dependency manifests
        id: notices
        run: |
          pnpm setup:licenses
          & ./work/package-tools/bin/cargo-about.exe --version
          & ./work/package-tools/bin/cargo-about.exe generate --manifest-path crates/desktop/Cargo.toml --target x86_64-pc-windows-msvc --no-default-features --locked --fail --config about.toml scripts/licenses.hbs --output-file work/resources/notices/rust.html
          node scripts/audit-js-licenses.mjs
      - run: pnpm package:app
        if: env.NATIVE_CANDIDATE_RUN_ID == ''
        id: package-build
      - name: Preserve the exact production installer candidate
        if: always() && steps.package-build.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: package-candidate-${{ github.sha }}
          path: |
            work/target/release/bundle/nsis/*.exe
            work/target/release/bundle/nsis/*.exe.build.json
          if-no-files-found: error
      - name: Reuse the explicitly selected measured installer candidate
        if: env.NATIVE_CANDIDATE_RUN_ID != ''
        uses: actions/download-artifact@v8.0.1
        with:
          name: package-candidate-${{ github.sha }}
          run-id: ${{ env.NATIVE_CANDIDATE_RUN_ID }}
          github-token: ${{ github.token }}
          path: work/package-candidate/
      - name: Cache the pinned test FFmpeg archive
        uses: actions/cache@v6.1.0
        with:
          path: work/ci-ffmpeg/*.zip
          key: test-ffmpeg-${{ runner.os }}-${{ hashFiles('e2e/support/prepare-ffmpeg.ps1') }}
      - name: Prepare generated production media
        id: native-tools-fixtures
        run: |
          & e2e/support/prepare-ffmpeg.ps1
          pnpm test:fixtures
      # Supplying manual evidence opts into its complete, exact-candidate validation.
      - name: Download explicitly selected external native measurements
        if: env.NATIVE_EVIDENCE_RUN_ID != ''
        uses: actions/download-artifact@v8.0.1
        with:
          name: gpui-native-external-${{ github.sha }}
          run-id: ${{ env.NATIVE_EVIDENCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: work/native-external/
      - name: Verify installer lifecycle and source/SBOM
        id: package-tests
        run: |
          if ($env:NATIVE_EVIDENCE_RUN_ID -and -not (Test-Path -LiteralPath work/native-external/report.json -PathType Leaf)) { throw 'The selected external evidence artifact has no report.json.' }
          $external = if ($env:NATIVE_EVIDENCE_RUN_ID) { @('-NativeExternalEvidence','work/native-external/report.json') } else { @() }
          $candidate = if ($env:NATIVE_CANDIDATE_RUN_ID) { @('-InstallerDirectory','work/package-candidate') } else { @() }
          $native = if ($env:REQUIRE_NATIVE_ACCEPTANCE -eq 'true') { @('-RequireNativeAcceptance') } else { @() }
          pwsh native/windows/package-verify.ps1 -ProductionProbe native/windows/package-production-uia.ps1 @external @candidate @native
      - name: Preserve package verification diagnostics
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: package-evidence-${{ github.sha }}
          path: |
            work/artifacts/
            work/test-results/windows-desktop.json
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ github.sha }}
          path: work/artifacts/release/
          if-no-files-found: error
  ci:
    name: ci
    needs: [validate, native-build, linux, windows, package]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'length == 5 and all(.[]; .result == "success")' <<< "$RESULTS"
  publish:
    needs: [ci]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.event.deleted != true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        id: node
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-${{ github.sha }}
          path: work/artifacts/release/
      - run: node scripts/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
