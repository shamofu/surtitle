name: Test and release
on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  native-build:
    needs: [linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        id: node
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the package manager declared by this checkout
        id: pnpm
        run: |
          package_manager=$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('package.json', 'utf8')).packageManager)")
          npm install -g "$package_manager"
          echo "version=$(pnpm --version)" >> "$GITHUB_OUTPUT"
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-pnpm-${{ steps.pnpm.outputs.version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:scripts
      - run: node scripts/native-ci-artifact.mjs check-inputs
      - uses: docker/setup-buildx-action@v4.3.0
      - name: Build the reviewed native toolchain image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: native/build/Dockerfile
          load: true
          push: false
          tags: surtitle-native-ci:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=native-toolchain-linux-amd64-v1
          cache-to: type=gha,scope=native-toolchain-linux-amd64-v1,mode=max
      - name: Fingerprint the prepared toolchain and create fresh cache staging
        id: native-cache
        run: node scripts/native-ci-cache.mjs prepare surtitle-native-ci:${{ github.sha }}
      - name: Restore native compiler results for these exact tools and flags
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.native-cache.outputs.directory }}/compiler
          key: ${{ steps.native-cache.outputs.compiler-key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.native-cache.outputs.compiler-key }}-
      - name: Restore source archives for checksum verification before extraction
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ${{ steps.native-cache.outputs.directory }}/source-cache
            ${{ steps.native-cache.outputs.directory }}/ort-archives
          key: ${{ steps.native-cache.outputs.source-key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.native-cache.outputs.source-key }}-
      - name: Build reviewed native inputs without host dependency/output mounts
        run: bash scripts/native-ci-build.sh --prebuilt-image
        env:
          SURTITLE_NATIVE_CACHE_DIR: ${{ steps.native-cache.outputs.directory }}
      - name: Save verified native compiler cache from a trusted main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ steps.native-cache.outputs.directory }}/compiler
          key: ${{ steps.native-cache.outputs.compiler-key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save verified source archives from a trusted main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ${{ steps.native-cache.outputs.directory }}/source-cache
            ${{ steps.native-cache.outputs.directory }}/ort-archives
          key: ${{ steps.native-cache.outputs.source-key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: native-build-${{ github.sha }}
          path: work/native-ci-artifact/
          compression-level: 0
          if-no-files-found: error
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        id: node
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: docker/setup-buildx-action@v4.3.0
      - name: Build the development container
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          load: true
          push: false
          tags: surtitle-devcontainer:local-check
          cache-from: type=gha,scope=devcontainer-linux-amd64-v1
          cache-to: type=gha,scope=devcontainer-linux-amd64-v1,mode=max
      - name: Share sources and verify temporary dependency/output masks
        run: node .devcontainer/container.mjs start surtitle-ci
      - name: Linux checks and actual headless Tauri E2E
        run: node .devcontainer/container.mjs verify surtitle-ci
      - name: Export selected verification evidence (never dependency/build trees)
        id: evidence
        if: always()
        run: |
          evidence_dir="$(mktemp -d "$RUNNER_TEMP/surtitle-linux-evidence.XXXXXXXX")"
          printf 'directory=%s\n' "$evidence_dir" >> "$GITHUB_OUTPUT"
          for report in container-isolation.json js-licenses.json js-sbom.cdx.json; do
            if docker exec surtitle-ci test -f /workspaces/surtitle/artifacts/$report; then
              docker exec --user vscode surtitle-ci cp "/workspaces/surtitle/artifacts/$report" "/opt/surtitle-build/evidence/$report"
              docker cp "surtitle-ci:/opt/surtitle-build/evidence/$report" "$evidence_dir/$report"
            fi
          done
          if docker exec surtitle-ci test -f /opt/surtitle-build/verification.log; then
            docker cp surtitle-ci:/opt/surtitle-build/verification.log "$evidence_dir/linux-verification.log"
          fi
          if docker exec surtitle-ci test -d /workspaces/surtitle/test-results/native; then
            docker exec --user vscode surtitle-ci mkdir -p /opt/surtitle-build/evidence/native-screenshots
            docker exec --user vscode surtitle-ci cp -a /workspaces/surtitle/test-results/native/. /opt/surtitle-build/evidence/native-screenshots/
            docker cp surtitle-ci:/opt/surtitle-build/evidence/native-screenshots "$evidence_dir/native-screenshots"
          fi
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: linux-evidence-${{ github.sha }}
          path: ${{ steps.evidence.outputs.directory }}
      - name: Remove this job's container writable layer
        if: always()
        run: docker rm --force surtitle-ci
  windows:
    needs: [native-build]
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh -NoProfile -Command "$ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; & '{0}'"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        id: node
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the package manager declared by this checkout
        id: pnpm
        run: |
          $packageManager = (Get-Content package.json -Raw | ConvertFrom-Json).packageManager
          npm install -g $packageManager
          "version=$(pnpm --version)" >> $env:GITHUB_OUTPUT
          "store=$(pnpm store path --silent)" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-pnpm-${{ steps.pnpm.outputs.version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: native-build-${{ github.sha }}
          path: work/native-ci-artifact/
      - name: Require the native artifact built from this commit's reviewed inputs
        run: node scripts/native-ci-artifact.mjs consume work/native-ci-artifact ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: windows-2025-debug
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-version.mjs
      - run: node scripts/check-production-features.mjs
      - run: pnpm test
      - run: pnpm build
      - run: cargo test --workspace --all-features --locked
      - name: Verify ordinary builds cannot bypass evaluation accounting
        run: cargo test -p surtitle-ai --no-default-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Acquire tested native runtime
        run: |
          pwsh scripts/native-prepare.ps1
          pwsh scripts/native-smoke.ps1
      - name: Prepare native WebDriver and generated media
        run: |
          cargo install tauri-driver --version 2.0.6 --locked --root work/driver
          pwsh scripts/prepare-webdriver.ps1 -InstallRuntime
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
          pnpm test:fixtures
          ffmpeg -v error -f lavfi -i 'testsrc2=size=320x180:rate=12:duration=3' -c:v libaom-av1 -cpu-used 8 -crf 50 -y work/e2e-av1.mkv
          cargo run -p surtitle-core --example seed_fixture -- "$PWD/work/e2e-windows" "$PWD/test-results/fixtures/日本語 & sample.mp4"
      - name: Build actual Windows native E2E binary
        run: cargo build -p surtitle --features e2e-test,custom-protocol --locked
      - name: Verify extracted audio against source-clock waveform references
        run: |
          $env:SURTITLE_TEST_FFMPEG = (Get-Command ffmpeg -CommandType Application).Source
          cargo test -p surtitle --lib --features e2e-test --locked installed_ffmpeg_preserves_ -- --ignored
      - name: WebView2 and libmpv E2E
        run: pnpm test:e2e
        env:
          SURTITLE_E2E_BINARY: ${{ github.workspace }}\target\debug\surtitle.exe
          SURTITLE_E2E_DATA_DIR: ${{ github.workspace }}\work\e2e-windows
          SURTITLE_E2E_AI_RECOVERY: translation
          SURTITLE_E2E_TRANSCRIPT_REVIEW: boundary
          SURTITLE_E2E_AV1_FIXTURE: ${{ github.workspace }}\work\e2e-av1.mkv
          SURTITLE_TAURI_DRIVER: ${{ github.workspace }}\work\driver\bin\tauri-driver.exe
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: windows-evidence-${{ github.sha }}
          path: |
            artifacts/
            test-results/
  package:
    needs: [linux, windows, native-build]
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh -NoProfile -Command "$ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; & '{0}'"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        id: node
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the package manager declared by this checkout
        id: pnpm
        run: |
          $packageManager = (Get-Content package.json -Raw | ConvertFrom-Json).packageManager
          npm install -g $packageManager
          "version=$(pnpm --version)" >> $env:GITHUB_OUTPUT
          "store=$(pnpm store path --silent)" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-pnpm-${{ steps.pnpm.outputs.version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: native-build-${{ github.sha }}
          path: work/native-ci-artifact/
      - name: Use the same native payload and source tested by Windows
        run: node scripts/native-ci-artifact.mjs consume work/native-ci-artifact ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: windows-2025-release
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-production-features.mjs
      - run: pwsh scripts/native-prepare.ps1
      - name: Build the locked installer plugin without installing a global Rust target
        run: |
          pwsh scripts/nsis-plugin-build.ps1
          pwsh scripts/native-installer-prepare.ps1
      - name: Generate distribution notices and dependency manifests
        run: |
          cargo install cargo-about --version 0.9.2 --locked
          cargo about generate scripts/licenses.hbs --output-file src-tauri/resources/notices/rust.html
          node scripts/audit-js-licenses.mjs
      - name: Require complete native redistribution evidence
        run: node scripts/native-audit.mjs --release
      - run: pnpm tauri build --bundles nsis -- --locked
      - name: Verify the source-backed plugin inside the exact installer
        run: pwsh scripts/native-installer-audit.ps1 -Installer (Get-ChildItem target/release/bundle/nsis/*.exe).FullName
      - name: Prepare exact production WebDriver and generated media
        run: |
          cargo install tauri-driver --version 2.0.6 --locked --root work/driver
          pwsh scripts/prepare-webdriver.ps1 -InstallRuntime
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
          pnpm test:fixtures
      - name: Test production installer and assemble source/SBOM
        run: pwsh scripts/package-verify.ps1
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ github.sha }}
          path: artifacts/release/
          if-no-files-found: error
  publish:
    needs: [linux, windows, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        id: node
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-${{ github.sha }}
          path: artifacts/release/
      - run: node scripts/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
