name: Test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/work/target
  SURTITLE_RESOURCE_DIR: ${{ github.workspace }}/work/resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  native-build:
    if: github.event.deleted != true
    uses: ./.github/workflows/native-build.yml
  linux:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
      LIBGL_ALWAYS_SOFTWARE: 1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Validate version and release tag
        run: |
          python3 - <<'PY'
          import os, re, subprocess, tomllib
          with open("Cargo.toml", "rb") as f:
              version = tomllib.load(f)["workspace"]["package"]["version"]
          if not re.fullmatch(r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", version):
              raise SystemExit("Cargo workspace.package.version must be an explicit stable X.Y.Z version.")
          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/"):
              sha = os.environ.get("GITHUB_SHA", "")
              if os.environ.get("GITHUB_EVENT_NAME") != "push" or ref != f"refs/tags/v{version}":
                  raise SystemExit("Release tag push must match refs/tags/v" + version)
              if not re.fullmatch(r"[a-f0-9]{40}", sha):
                  raise SystemExit("Release tag push requires full commit SHA.")
              tag = ref.removeprefix("refs/tags/")
              if subprocess.check_output(["git", "rev-parse", "--verify", "HEAD^{commit}"], text=True).strip() != sha:
                  raise SystemExit("Checkout HEAD differs from GITHUB_SHA.")
              if subprocess.check_output(["git", "rev-parse", "--verify", f"refs/tags/{tag}^{{commit}}"], text=True).strip() != sha:
                  raise SystemExit("Tag commit differs from GITHUB_SHA.")
              subprocess.check_call(["git", "merge-base", "--is-ancestor", sha, "refs/remotes/origin/main"])
          print(f"Validated version {version}")
          PY
      - name: Read Rust toolchain version
        id: rust
        run: echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2.87.28
        with:
          tool: cargo-nextest@0.9.148,cargo-deny@0.20.2
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ubuntu-24.04-debug
          workspaces: . -> work/target
      - name: Install Linux desktop and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake perl pkg-config clang libfontconfig1-dev libfreetype6-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev mesa-vulkan-drivers libssl-dev xvfb dbus-x11 ffmpeg libmpv-dev fonts-noto-cjk
      - name: Production feature contract
        run: |
          python3 - <<'PY'
          import re, subprocess
          lines = subprocess.check_output(
              ["cargo", "tree", "--locked", "--package", "surtitle", "--no-default-features",
               "--edges", "normal,build", "--prefix", "none", "--format", "{p}|{f}"],
              text=True,
          ).splitlines()
          for line in lines:
              if re.match(r'^(?:tauri(?:-\S+)?|wry|webview2(?:-\S+)?|webkit2gtk(?:-\S+)?) v', line):
                  raise SystemExit(f"Browser runtime dependency in production graph: {line}")
          rows = [l for l in lines if re.match(r'^surtitle(?:-ai)? v', l)]
          if not any(l.startswith("surtitle v") for l in rows) or not any(l.startswith("surtitle-ai v") for l in rows):
              raise SystemExit("Production dependency graph is missing surtitle or surtitle-ai.")
          banned = {"development-validation", "e2e-fixtures", "e2e-test", "test-support"}
          for row in rows:
              feats = re.sub(r'\s*\(\*\)$', '', row.split('|', 1)[1]).split(',')
              if any(f.strip() in banned for f in feats):
                  raise SystemExit(f"Development-only feature in production graph: {row}")
          PY
      - name: Build the native GPUI desktop
        run: cargo build --locked --package surtitle
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust workspace tests
        run: cargo nextest run --workspace --all-features --locked --profile ci --no-tests fail
      - name: Rust tests without default features
        run: cargo nextest run -p surtitle-ai --no-default-features --locked --profile ci-no-default --no-tests fail
      - name: Rust documentation tests
        run: |
          cargo test --workspace --all-features --locked --doc
          cargo test -p surtitle-ai --no-default-features --locked --doc
      - name: Rust lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Dependency audits
        run: cargo deny check licenses bans sources
      - name: Required FFmpeg integration tests
        env:
          SURTITLE_TEST_FFMPEG: /usr/bin/ffmpeg
        run: |
          test -x "$SURTITLE_TEST_FFMPEG" && test -x /usr/bin/ffprobe
          cargo nextest run -p surtitle --lib --features e2e-test --locked --profile required --run-ignored only --ignore-default-filter --no-tests fail -E 'test(=application::media_tools::card_audio::tests::installed_ffmpeg_preserves_native_rate_wav_tail_without_padding) | test(=application::media_tools::card_audio::tests::installed_ffmpeg_preserves_source_clock_and_cleans_failed_outputs)'
          cargo nextest run -p surtitle-tools --lib --locked --profile required --run-ignored only --ignore-default-filter --no-tests fail -E 'test(=command::tests::multitrack_extraction_preserves_selected_stream)'
          cargo nextest run -p surtitle-ai --lib --no-default-features --locked --profile required --run-ignored only --ignore-default-filter --no-tests fail -E 'test(=prepare::encoding::file_tests::openai_file_real_encoding_splits_only_oversized_files_and_preserves_pcm)'
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: linux-evidence-${{ github.sha }}
          path: work/test-results/
          if-no-files-found: ignore
  windows:
    needs: [native-build]
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh -NoProfile -Command "$ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; & '{0}'"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read Rust toolchain version
        id: rust
        run: |
          $toml = Get-Content -LiteralPath rust-toolchain.toml -Raw -Encoding UTF8
          $match = [regex]::Match($toml, '(?m)^channel\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw 'Missing toolchain.channel in rust-toolchain.toml.' }
          "version=$($match.Groups[1].Value)" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2.87.28
        with:
          tool: cargo-nextest@0.9.148
      - uses: actions/download-artifact@v8.0.1
        with:
          name: native-build-${{ github.sha }}
          path: work/native-ci-artifact/
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: windows-2025-debug
          workspaces: . -> work/target
      - name: Production feature contract
        run: |
          $lines = cargo tree --locked --package surtitle --no-default-features --edges normal,build --prefix none --format '{p}|{f}'
          if ($lines | Where-Object { $_ -match '^(?:tauri(?:-\S+)?|wry|webview2(?:-\S+)?|webkit2gtk(?:-\S+)?) v' }) { throw 'Browser runtime dependency in production graph.' }
          $rows = @($lines | Where-Object { $_ -match '^surtitle(?:-ai)? v' })
          if (-not ($rows | Where-Object { $_ -match '^surtitle v' }) -or -not ($rows | Where-Object { $_ -match '^surtitle-ai v' })) { throw 'Production dependency graph is incomplete.' }
          foreach ($row in $rows) {
            $feats = (($row -split '\|', 2)[1] -replace '\s*\(\*\)$', '') -split ','
            if ($feats | Where-Object { $_.Trim() -in @('development-validation', 'e2e-fixtures', 'e2e-test', 'test-support') }) { throw "Development-only feature in production graph: $row" }
          }
      - name: Build the native GPUI desktop
        run: cargo build --locked --package surtitle
      - name: Rust workspace tests
        run: cargo nextest run --workspace --all-features --locked --profile ci --no-tests fail
      - name: Windows GPUI backend regressions
        run: cargo test -p gpui-pre-windows --lib --locked
      - name: Rust tests without default features
        run: cargo nextest run -p surtitle-ai --no-default-features --locked --profile ci-no-default --no-tests fail
      - name: Rust documentation tests
        run: |
          cargo test --workspace --all-features --locked --doc
          cargo test -p surtitle-ai --no-default-features --locked --doc
      - name: Rust lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Cache ONNX Runtime archive
        uses: actions/cache@v6.1.0
        with:
          path: work/native-cache/onnxruntime-1.29.0/microsoft.ml.onnxruntime.1.29.0.zip
          key: ort-windows-1.29.0-nuget
      - name: Prepare native runtime and smoke test
        run: |
          pwsh native/windows/native-prepare.ps1 -WithDevModel
          pwsh native/windows/native-smoke.ps1
      - name: Cache pinned test FFmpeg archive
        uses: actions/cache@v6.1.0
        with:
          path: work/ci-ffmpeg/ffmpeg-9.0.2-essentials_build.zip
          key: test-ffmpeg-windows-9.0.2
      - name: Prepare pinned test FFmpeg
        run: |
          $version = '9.0.2'
          $expectedHash = '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba'
          $dir = [IO.Path]::GetFullPath('work/ci-ffmpeg')
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $zip = Join-Path $dir "ffmpeg-$version-essentials_build.zip"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            $partial = "$zip.partial"
            try {
              & "$env:SystemRoot\System32\curl.exe" --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 30 --max-time 600 --retry 2 --retry-all-errors --retry-delay 2 --output $partial "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-$version-essentials_build.zip"
              if ((Get-FileHash -LiteralPath $partial -Algorithm SHA256).Hash -ne $expectedHash) { throw 'Test FFmpeg archive SHA-256 mismatch.' }
              Move-Item -LiteralPath $partial -Destination $zip
            } finally {
              if (Test-Path -LiteralPath $partial -PathType Leaf) { Remove-Item -LiteralPath $partial -Force }
            }
          }
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne $expectedHash) { throw 'Test FFmpeg archive SHA-256 mismatch.' }
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $ffmpeg = [IO.Path]::GetFullPath((Join-Path $dir "ffmpeg-$version-essentials_build/bin/ffmpeg.exe"))
          $ffprobe = [IO.Path]::GetFullPath((Join-Path $dir "ffmpeg-$version-essentials_build/bin/ffprobe.exe"))
          if (-not (Test-Path -LiteralPath $ffmpeg -PathType Leaf) -or -not (Test-Path -LiteralPath $ffprobe -PathType Leaf)) { throw 'Missing pinned FFmpeg or ffprobe.' }
          "SURTITLE_TEST_FFMPEG=$ffmpeg" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Required FFmpeg, libmpv and Silero integration tests
        run: |
          cargo nextest run -p surtitle --lib --features e2e-test --locked --profile required --run-ignored only --ignore-default-filter --no-tests fail -E 'test(=application::media_tools::card_audio::tests::installed_ffmpeg_preserves_native_rate_wav_tail_without_padding) | test(=application::media_tools::card_audio::tests::installed_ffmpeg_preserves_source_clock_and_cleans_failed_outputs) | test(=player::subtitle_tests::real_mpv_load_restores_position_and_maps_audio_stream) | test(=player::native::composition_tests::owned_composition_swapchain_survives_stop_reconfigure_and_player_destruction) | test(=player::native::composition_tests::composition_snapshot_follows_reconfiguration_without_prepaint_core_calls) | test(=application::transfer::restore_tests::real_mpv_restore_reconciles_resume_audio_subtitles_and_stale_ticks) | test(/^ui::tests::study_wheel::applied::/)'
          cargo nextest run -p surtitle-tools --lib --locked --profile required --run-ignored only --ignore-default-filter --no-tests fail -E 'test(=command::tests::multitrack_extraction_preserves_selected_stream)'
          cargo nextest run -p surtitle-ai --lib --no-default-features --locked --profile required --run-ignored only --ignore-default-filter --no-tests fail -E 'test(=prepare::encoding::file_tests::openai_file_real_encoding_splits_only_oversized_files_and_preserves_pcm) | test(=prepare::tests::real_silero_and_ffmpeg_preserve_selection_time) | test(=prepare::tests::real_preparation_failures_remove_receipts_and_temporary_files)'
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: windows-evidence-${{ github.sha }}
          path: |
            work/artifacts/
            work/test-results/
          if-no-files-found: ignore
  package:
    needs: [native-build]
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh -NoProfile -Command "$ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; & '{0}'"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify the system VC runtime before building the installer
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File native/vc-prerequisite.ps1 -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw 'The package runner failed the VC runtime prerequisite check.' }
      - name: Read Rust toolchain version
        id: rust
        run: |
          $toml = Get-Content -LiteralPath rust-toolchain.toml -Raw -Encoding UTF8
          $match = [regex]::Match($toml, '(?m)^channel\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw 'Missing toolchain.channel in rust-toolchain.toml.' }
          "version=$($match.Groups[1].Value)" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - uses: taiki-e/install-action@v2.87.28
        with:
          tool: cargo-about@0.9.2
      - uses: actions/download-artifact@v8.0.1
        with:
          name: native-build-${{ github.sha }}
          path: work/native-ci-artifact/
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: windows-2025-release-v2
          workspaces: . -> work/target
          cache-targets: false
          cache-directories: |
            work/target/debug
            work/target/release
      - name: Cache pinned NSIS archive
        uses: actions/cache@v6.1.0
        with:
          path: work/tools/nsis/nsis-3.11.zip
          key: nsis-windows-3.11
      - name: Prepare pinned NSIS compiler
        run: |
          $version = '3.11'
          $expectedHash = 'c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1'
          $dir = [IO.Path]::GetFullPath('work/tools/nsis')
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $zip = Join-Path $dir "nsis-$version.zip"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            $partial = "$zip.partial"
            try {
              & "$env:SystemRoot\System32\curl.exe" --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 30 --max-time 600 --retry 2 --retry-all-errors --retry-delay 2 --output $partial "https://downloads.sourceforge.net/project/nsis/NSIS%203/$version/nsis-$version.zip"
              if ((Get-FileHash -LiteralPath $partial -Algorithm SHA256).Hash -ne $expectedHash) { throw 'NSIS archive SHA-256 mismatch.' }
              Move-Item -LiteralPath $partial -Destination $zip
            } finally {
              if (Test-Path -LiteralPath $partial -PathType Leaf) { Remove-Item -LiteralPath $partial -Force }
            }
          }
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne $expectedHash) { throw 'NSIS archive SHA-256 mismatch.' }
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $makensis = [IO.Path]::GetFullPath((Join-Path $dir "nsis-$version/makensis.exe"))
          if (-not (Test-Path -LiteralPath $makensis -PathType Leaf)) { throw "Missing makensis.exe at $makensis" }
          $actualVersion = (& $makensis /VERSION).Trim()
          if ($actualVersion -ne "v$version") { throw "Expected NSIS v$version, got $actualVersion" }
          "SURTITLE_NSIS_COMPILER=$makensis" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Cache ONNX Runtime archive
        uses: actions/cache@v6.1.0
        with:
          path: work/native-cache/onnxruntime-1.29.0/microsoft.ml.onnxruntime.1.29.0.zip
          key: ort-windows-1.29.0-nuget
      - name: Build installer package
        run: |
          pwsh native/windows/package.ps1
          New-Item -ItemType Directory -Path work/artifacts/release -Force | Out-Null
          Copy-Item -Path work/target/release/bundle/nsis/*_x64-setup.exe -Destination work/artifacts/release/ -Force
          Copy-Item -LiteralPath work/native-ci-artifact/libmpv-source.tar.gz -Destination work/artifacts/release/ -Force
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ github.sha }}
          path: work/artifacts/release/
          if-no-files-found: error
  ci:
    name: ci
    needs: [native-build, linux, windows, package]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'length == 4 and all(.[]; .result == "success")' <<< "$RESULTS"
  publish:
    needs: [ci]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.event.deleted != true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-${{ github.sha }}
          path: work/artifacts/release/
      - name: Verify release tag and publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import re, tomllib; v=tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"]; assert re.fullmatch(r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", v); print(v)')
          TAG="v${VERSION}"
          test "$GITHUB_REF" = "refs/tags/${TAG}"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          REMOTE_SHA=$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | awk -v t="refs/tags/${TAG}" '$2 == t "^{}" {d=$1} $2 == t {p=$1} END {print (d ? d : p)}')
          test "$REMOTE_SHA" = "$GITHUB_SHA"
          INSTALLER="Surtitle_${VERSION}_x64-setup.exe"
          test -s "work/artifacts/release/${INSTALLER}"
          test -s "work/artifacts/release/libmpv-source.tar.gz"
          (cd work/artifacts/release && sha256sum "${INSTALLER}" libmpv-source.tar.gz > SHA256SUMS.txt)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Surtitle ${VERSION}" --latest \
            "work/artifacts/release/${INSTALLER}" \
            "work/artifacts/release/libmpv-source.tar.gz" \
            "work/artifacts/release/SHA256SUMS.txt"
