packages:
  - '.'
  - '!work/**'
  - '!native/**'
  - '!node_modules/**'
  - '!.pnpm/**'
  - '!.git/**'
  - '!src-tauri/gen/**'
  - '!src-tauri/resources/**'
  - '!vendor/**'
  - '!javascript-packages/**'
  - '!native-sources/**'
  - '!native-installer-sources/**'
cargo:
  enabled: true
# Preserve native Windows arguments containing backslashes, spaces and symbols.
shellEmulator: true
allowBuilds:
  edgedriver: false
  esbuild: true
  geckodriver: false
