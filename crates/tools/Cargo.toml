[package]
name = "surtitle-tools"
publish = false
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "External and managed media tool discovery, verification, and rolling updates"

[dependencies]
anyhow = "1"
pgp = { version = "0.20", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread"] }
tokio-util = "0.7"
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
