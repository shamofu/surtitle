[binaries]
c = ['ccache', 'x86_64-w64-mingw32-gcc-posix']
cpp = ['ccache', 'x86_64-w64-mingw32-g++-posix']
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'
dlltool = 'x86_64-w64-mingw32-dlltool'
nasm = 'nasm'
cmake = 'cmake'
pkg-config = 'pkg-config'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
c_args = ['-D_WIN32_WINNT=0x0A00', '-I/build/prefix/include']
cpp_args = ['-D_WIN32_WINNT=0x0A00', '-I/build/prefix/include']
c_link_args = ['-L/build/prefix/lib', '-static-libgcc', '-static']
cpp_link_args = ['-L/build/prefix/lib', '-static-libgcc', '-static-libstdc++', '-static']
